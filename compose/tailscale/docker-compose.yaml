x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

volumes:
  tailscale:

services:
  tailscale:
    container_name: traefik_tailscale
    image: ${TAILSCALE_IMAGE:?}
    restart: unless-stopped
    entrypoint: [/bin/sh, /usr/local/bin/tailscale-entrypoint.sh]
    command: [/usr/local/bin/containerboot]
    environment:
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_FORWARD_MSS: ${TS_FORWARD_MSS:?}
      TS_HOSTNAME: ${TS_HOSTNAME:?}
      TS_ROUTES: ${TS_ROUTES:?}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    env_file:
      - path: ${PWD}/env/.env.tailscale.local
        required: false
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/compose/tailscale/entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    networks:
      - proxy
      - tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      coredns:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9002/healthz]

  coredns:
    container_name: traefik_coredns
    build:
      context: ${PWD}/compose/tailscale/coredns
      dockerfile_inline: |-
        FROM ${ALPINE_IMAGE:?}

        RUN apk add --no-cache bind-tools curl

        COPY --from=${COREDNS_IMAGE:?} /coredns /usr/local/bin/coredns
        COPY --from=${GOMPLATE_IMAGE:?} /bin/gomplate /usr/local/bin/gomplate

        USER 1000
        WORKDIR /usr/src/app

        ENTRYPOINT ["/bin/sh", "/usr/src/app/entrypoint.sh"]
    restart: unless-stopped
    environment:
      DIRECT_DOMAIN: ${DIRECT_DOMAIN:?}
      TAIL_DOMAIN: ${TAIL_DOMAIN:?}
      TRAEFIK_DNS_NAME: traefik.docker.local
    volumes:
      - ${PWD}/compose/tailscale/coredns/entrypoint.sh:/usr/src/app/entrypoint.sh:ro
      - ${PWD}/compose/tailscale/coredns/Corefile.gotpl:/usr/src/app/Corefile.gotpl:ro
    expose:
      - 53/tcp
      - 53/udp
    networks:
      proxy:
      tailscale:
        ipv4_address: ${TS_DNS_SERVER:?}
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
