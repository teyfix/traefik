log:
  level: DEBUG

ping: {}

api:
  insecure: true
  dashboard: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    http:
      tls:
        certResolver: stepca
    address: :443
  # Private Docker-network entrypoint for cache misses that wake model runtimes.
  upstreamwake:
    address: :8088
  shared:
    address: :4040

providers:
  docker:
    network: traefik_proxy
    exposedByDefault: false

certificatesResolvers:
  stepca:
    acme:
      email: "dev@example.com"
      storage: "/acme/acme.json"
      caServer: "https://host.docker.internal:9000/acme/acme/directory"
      httpChallenge:
        entryPoint: web

experimental:
  localPlugins:
    sablier:
      moduleName: github.com/sablierapp/sablier-traefik-plugin
