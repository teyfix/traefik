name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install check dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck repository scripts
        run: bun run typecheck
      - name: Test rule limits and discovery
        run: bun test
      - name: Validate default single-container model
        run: docker compose --env-file .example.env -f docker-compose.yaml config --quiet
      - name: Validate rendered ingress addresses
        run: COMPOSE_FILE=docker-compose.legacy.yaml bun scripts/check-ingress-config.ts --env-file .example.env
      - name: Reject invalid rendered ingress addresses
        run: COMPOSE_FILE=docker-compose.legacy.yaml bun scripts/check-ingress-invalid-configs.ts --env-file .example.env
      - name: Prove ingress addresses across recreation orders
        run: COMPOSE_FILE=docker-compose.legacy.yaml bun scripts/check-ingress-restart-order.ts
      - name: Check current agent rules
        run: bun run check:agent-rules
