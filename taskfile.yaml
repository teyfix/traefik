version: 3
tasks:
  check:agent-rules:
    desc: Typecheck, test, and enforce the 12,000-character agent rule limit
    cmds:
      - bun run typecheck
      - bun test
      - bun run check:agent-rules
  check:ingress-config:
    desc: Validates the selected bundle or legacy ingress configuration
    cmds:
      - |
        if docker compose config --images | grep -Eq '^teyfix/traefik[:@]'; then
          docker compose config --quiet
        else
          bun scripts/check-ingress-config.ts
        fi
  onboard:
    desc: Runs standalone onboarding; --bundle-source PATH selects the local bundle preview
    cmds:
      - bun scripts/onboarding.ts {{.CLI_ARGS}}
  up:
    desc: Starts or recreates all services
    cmds:
      - task: check:ingress-config
      - docker compose up -d --force-recreate --remove-orphans {{.CLI_ARGS}}
  down:
    desc: Stops all services while preserving persistent state
    cmds:
      - docker compose down --remove-orphans {{.CLI_ARGS}}
  logs: docker compose logs --follow --tail 0 {{.CLI_ARGS}}
  recreate:
    desc: Recreates all services
    cmds:
      - task: up
  purge:
    desc: Stops the stack and permanently removes CA, ACME, and Tailscale state
    prompt: This permanently deletes the Step CA, ACME, and Tailscale state. Continue?
    cmds:
      - docker compose down --remove-orphans --volumes {{.CLI_ARGS}}
      - sudo rm -rf -- '{{.ROOT_DIR}}/.state/stepca/data' '{{.ROOT_DIR}}/.state/traefik/acme' '{{.ROOT_DIR}}/.state/tailscale/data'
  certs:
    desc: Copies certs from container to host
    cmds:
      - docker compose exec traefik sh -c "mkdir -p /tmp/exported && cp /home/step/certs/*.crt /tmp/exported"
      - mkdir -p certs
      - docker compose cp traefik:/tmp/exported/. ./certs
  certs:install:
    desc: Installs root_ca.crt to system trust store (Linux)
    vars:
      cert_path: /usr/local/share/ca-certificates/traefik-stepca-root-ca.crt
    cmds:
      - sudo cp certs/root_ca.crt {{.cert_path}}
      - sudo update-ca-certificates
      - sudo chmod 644 {{.cert_path}}
    deps:
      - certs
